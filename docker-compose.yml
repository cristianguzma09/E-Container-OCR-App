services:
  db:
    image: postgres:16-alpine
    container_name: econtainer-db
    environment:
      POSTGRES_USER: econtainer
      POSTGRES_PASSWORD: econtainer
      POSTGRES_DB: econtainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econtainer -d econtainer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
