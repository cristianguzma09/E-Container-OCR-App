[alembic]
script_location = src/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
version_path_separator = os

# Left empty on purpose: env.py reads the URL from src.platform.config so the
# application and the migrations can never disagree about which database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
